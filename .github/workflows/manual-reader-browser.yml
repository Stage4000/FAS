            /docs/showcase-public-runtime.md
            /docs/showcase-rate-admission.md
            /docs/showcase-request-integration.md
            /docs/showcase-root-route.md
            /docs/showcase-session-integration.md
            /showcase-gallery.php
            /showcase-photo.php
            /showcase.php
            /src/showcase/ShowcaseAdminAuthorization.php
            /src/showcase/ShowcaseAdminController.php
            /src/showcase/ShowcaseAdminRuntime.php
