name: Isolated synthetic manual reader acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'manuals/**'
      - 'src/manuals/**'
      - 'scripts/manuals-intake-inventory.py'
      - 'scripts/manuals-intake-capacity.py'
      - 'scripts/manuals-intake-manifest.php'
      - 'admin/manuals*.php'
      - 'includes/manual-reader.php'
      - 'public/js/manual-reader*.mjs'
      - 'public/css/manuals.css'
      - 'public/vendor/pdfjs-6.5.438/**'
      - 'tests/manuals/**'
      - 'docs/manuals*.md'
      - '.github/workflows/manual-reader-browser.yml'

permissions:
  contents: read

jobs:
  synthetic-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate without saved credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 60
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /api/products.php
            /api/saved-search.php
            /includes/saved-search-notify-form.php
            /products.php
            /src/utils/SavedSearchCapture.php
            /tests/catalog-heading-identity-test.py
            /tests/form-input-shape-test.php
            /tests/saved-search-capture-test.php
            /admin/sale.php
            /tests/sale-schedule-http-test.py
            /checkout.php
            /tests/cart-malformed-hydration-test.cjs
            /tests/checkout-coupon-lifecycle-test.cjs
            /tests/keyboard-browser/shipping-identity-test.py
            /.github/workflows/showcase-browser-acceptance.yml
            /admin/showcase-detail.php
            /admin/showcase-moderate.php
            /admin/showcase-photo.php
            /admin/showcase-queue.php
            /docs/customer-showcase-foundation.md
