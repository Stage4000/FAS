name: Dormant showcase browser acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/showcase/**'
      - 'admin/showcase-*.php'
      - 'tests/showcase-*'
      - 'tests/fixtures/admin-auth-main.php'
      - '.github/workflows/showcase-browser-acceptance.yml'
permissions:
  contents: read
jobs:
  synthetic-admin-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/showcase/**
            /tests/showcase-*
            /tests/fixtures/admin-auth-main.php
      - name: Install isolated browser test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-gd python3-venv
          python3 -m venv /tmp/showcase-browser-venv
          /tmp/showcase-browser-venv/bin/pip install playwright==1.62.0
          /tmp/showcase-browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Admin lifecycle, logout privacy and mobile regression
        # The fixture uses synthetic accounts/storage and exact pinned auth source.
        # No external service is reachable inside this network namespace.
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec runuser -u "$1" -- /tmp/showcase-browser-venv/bin/python tests/showcase-admin-browser-check.py' _ "$(id -un)"
